info.app:
  name: Official Visits API
  version: 1.0

spring:
  application:
    name: hmpps-official-visits-api

  http:
    codecs:
      max-in-memory-size: 50MB

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER}/${DB_NAME}?sslmode=${DB_SSL_MODE}'
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      pool-name: OFFICIAL-VISITS-DB-CP
      connection-timeout: 15000
      validation-timeout: 2000
      maximum-pool-size: 15
      max-lifetime: 600000
      leak-detection-threshold: 0
      minimum-idle: 5
      keepalive-time: 10000
  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

  flyway:
    locations: classpath:/migrations/common,classpath:/migrations/prod
    placeholders:
      dpr_user: ${DPR_USER}
      dpr_password: ${DPR_PASSWORD}

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"

  jackson2:
    date-format: "yyyy-MM-dd HH:mm:ss"
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${api.base.url.hmpps-auth}/.well-known/jwks.json

      client:
        registration:
          manage-users:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          locations-inside-prison:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          prisoner-search:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          personal-relationships:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          non-associations:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          alerts:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
          prison-register:
            provider: hmpps-auth
            client-id: ${api.client.id}
            client-secret: ${api.client.secret}
            authorization-grant-type: client_credentials
            scope: read
        provider:
          hmpps-auth:
            token-uri: ${api.base.url.hmpps-auth}/oauth/token

  task:
    execution:
      thread-name-prefix: async-thread-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50

  mvc:
    async:
      request-timeout: 60000 # one minute request timeout
  web:
    error:
      include-message: always

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

service:
  active-prisons: ${FEATURE_DPS_ENABLED_PRISONS:}

hmpps:
  sqs:
    queueAdminRole: OFFICIAL_VISITS_ADMIN
    defaultErrorVisibilityTimeout: 1, 10, 60, 600
  sar:
    template:
      path: /sar/templates/sar_template.mustache
      enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: false
  api-docs:
    enabled: false

